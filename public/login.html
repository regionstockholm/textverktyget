    <main>
      <section class="flex flex-row flex-justify-content-center">
        <div class="flex flex-column gap-6 pi-16">
          <h1>Logga in till textverktyget</h1>
          <p>
            Inskickad text loggas med användarnamn och tid i minst 30 dagar.
            Kontakta administratören för aktuell lagringstid.
          </p>
          <form
            id="login-form"
            action="/auth/login"
            method="post"
            class="flex flex-column gap-4 login-form"
          >
            <label for="username">Användarnamn</label>
            <input
              id="username"
              class="modal-input"
              name="username"
              autocomplete="username"
              required
              maxlength="100"
            />
            <label for="password">Lösenord</label>
            <input
              id="password"
              class="modal-input"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <p id="error-message" role="alert" aria-live="polite"></p>
            <button
              id="login-button"
              type="submit"
              class="text-lg filled-blue outline-blue large-button"
            >
              Logga in
            </button>
          </form>
        </div>
      </section>
    </main>
